<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECT YOUR ROLE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            /* Slate 900 */
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #111827;
            /* Gray 900 */
            font-size: 24px;
            text-transform: uppercase;
        }

        p {
            color: #6b7280;
            /* Gray 500 */
            margin-bottom: 32px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
            text-align: center;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        .btn-primary {
            background-color: #2563eb;
            /* Blue 600 */
            color: white;
            border-color: #2563eb;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            /* Blue 700 */
        }

        .btn-secondary {
            background-color: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h2>TELECALLER</h2>
        <p>Please select your login portal</p>

        <div class="btn-group">
            <a href="/login" class="btn btn-primary">
                UPLOAD CSV
            </a>

            <a href="/admin/login" class="btn btn-secondary">
                ADMIN ANALYTICS
            </a>
        </div>

        <div class="footer">
            &copy; 2026 TELECALLER
        </div>
    </div>
</body>

</html>
