<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecaller System | Select Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #1f2937;
            font-size: 24px;
        }

        p {
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-admin {
            background-color: #f3f4f6;
            color: #374151;
            border-color: #e5e7eb;
        }

        .btn-admin:hover {
            background-color: #e5e7eb;
            color: #1f2937;
        }

        .btn-telecaller {
            background-color: #eff6ff;
            color: #1d4ed8;
            border-color: #dbeafe;
        }

        .btn-telecaller:hover {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .icon {
            font-size: 18px;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h2>Telecaller System</h2>
        <p>Please select your login portal</p>

        <div class="btn-group">
            <a href="/login" class="btn btn-telecaller">
                <span class="icon">☎️</span> Upload Calls (Telecaller)
            </a>

            <!-- Note: Admin Dashboard is expected to be served from the same domain or distinct port. 
           If running separately (Vite default), this link might need to be absolute, 
           but per prompt request for backend serving, we direct to /admin/login assuming proxy or build integration. 
           However, effectively this will go to where the frontend admin route is hosted. 
           If separate: http://localhost:5173/admin/login 
           If integrated in production: /admin/login -->
            <a href="http://localhost:5173/admin/login" class="btn btn-admin">
                <span class="icon">🔐</span> Admin Analytics
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Admin Portal
        </div>
    </div>
</body>

</html>
