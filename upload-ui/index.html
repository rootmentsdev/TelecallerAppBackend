<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Lead Import - Telecaller App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        .file-info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .status-details {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.6;
        }


        .user-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .logout-btn {
            background: #dc3545;
            margin-top: 10px;
            padding: 10px;
            font-size: 14px;
        }

        .logout-btn:hover:not(:disabled) {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Upload Section -->
        <div id="uploadSection">
            <h1>CSV Lead Import</h1>
            <p class="subtitle">Upload CSV file to import leads</p>
            
            <div id="userInfo" class="user-info"></div>
            
            <form id="uploadForm">
                <div class="form-group">
                    <label for="leadType">Lead Type</label>
                    <select id="leadType" name="leadType" required>
                        <option value="">Select lead type...</option>
                        <option value="walkin">Walk-in</option>
                        <option value="lossofsale">Loss of Sale</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="csvFile">CSV/Excel File</label>
                    <input type="file" id="csvFile" name="file" accept=".csv,.xlsx,.xls" required>
                    <div class="file-info">Supports CSV and Excel files (.csv, .xlsx, .xls)</div>
                </div>
                
                <button type="submit" id="uploadBtn">Upload CSV</button>
                <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
            </form>
            
            <div id="uploadStatus" class="status"></div>
        </div>
    </div>

    <script src="upload.js"></script>
</body>
</html>
